# Copy to .github/workflows/rose-review.yml.
name: Rose review
on:
  pull_request:
permissions:
  contents: read
jobs:
  review:
    # Secrets are unavailable to fork pull requests.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: ollygarden/rose-cli@main
        with:
          command: review
          github-token: ${{ secrets.OLLYGARDEN_ROSE_RELEASES_TOKEN }}
          ollygarden-api-key: ${{ secrets.OLLYGARDEN_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
